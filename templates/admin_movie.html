{% extends "base.html" %}{% block title %}Movie editor — StreamFlix{% endblock %}{% block content %}<h1>{{ 'Edit' if movie.id else 'Add' }} movie</h1><form class="editor" method="post"><label>Title<input name="title" value="{{ movie.title or '' }}" required></label><label>Overview<textarea name="overview">{{ movie.overview or '' }}</textarea></label><div class="two"><label>Year<input name="year" type="number" min="1888" max="2100" value="{{ movie.year or '' }}"></label><label>Language<input name="language" value="{{ movie.language or '' }}" placeholder="en"></label></div><label>Genres (comma-separated)<input name="genres" value="{{ movie.genres or '' }}"></label><label>Poster path or full URL<input name="poster_path" value="{{ movie.poster_path or '' }}"></label><label>Backdrop path or full URL<input name="backdrop_path" value="{{ movie.backdrop_path or '' }}"></label><label>YouTube trailer key<input name="trailer_key" value="{{ movie.trailer_key or '' }}" placeholder="YouTube video ID"></label><label>Licensed MP4 URL<input name="video_url" value="{{ movie.video_url or '' }}"></label><label class="check"><input type="checkbox" name="published" {% if movie.published or not movie.id %}checked{% endif %}> Published</label><button>Save movie</button></form>{% endblock %}
