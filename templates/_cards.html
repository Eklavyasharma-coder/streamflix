<div class="grid">{% for movie in movies %}<a class="movie" href="{{ url_for('detail', movie_id=movie.id) }}"><div class="poster">{% if movie.poster %}<img loading="lazy" src="{{ movie.poster }}" alt="{{ movie.title }} poster">{% else %}<div class="placeholder">▶<small>STREAMFLIX</small></div>{% endif %}</div><div class="movieinfo"><strong>{{ movie.title }}</strong><span>{{ movie.year or 'Year TBA' }} · {{ movie.average_rating or 'New' }}{% if movie.average_rating %}/5{% endif %}</span></div></a>{% else %}<p>No titles match these filters yet.</p>{% endfor %}</div>
