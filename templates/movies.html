{% extends "base.html" %}{% block title %}Browse — StreamFlix{% endblock %}{% block content %}<h1>{{ page_title or 'Browse movies' }}</h1><form class="filters" method="get"><input name="q" value="{{ q }}" placeholder="Title, genre, description"><input name="genre" value="{{ genre }}" placeholder="Genre (e.g. Action)"><input name="language" value="{{ language }}" placeholder="Language (e.g. en)"><input name="year" value="{{ year }}" placeholder="Year" inputmode="numeric"><select name="rating"><option value="">Any rating</option>{% for n in [3,4,4.5] %}<option value="{{ n }}" {% if rating == n|string %}selected{% endif %}>{{ n }}+ / 5</option>{% endfor %}</select><select name="sort"><option value="newest" {% if sort=='newest' %}selected{% endif %}>Recently added</option><option value="rating" {% if sort=='rating' %}selected{% endif %}>Highest rated</option><option value="title" {% if sort=='title' %}selected{% endif %}>Title A–Z</option></select><button>Apply filters</button></form>{% include "_cards.html" %}{% endblock %}
